            - heading "Born in the High Country" [level=3] [ref=e79]
            - paragraph [ref=e80]: Olathe Sweet was developed for Colorado's mountain climate — intense sun by day, crisp nights by morning. That contrast makes a sweetness no other soil can claim.
          - generic [ref=e82]:
