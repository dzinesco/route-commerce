            - heading "Seed to Field, Naturally" [level=3] [ref=e69]
            - paragraph [ref=e70]: Our Olathe Sweet seed has never been touched by a laboratory. The flavor was shaped by forty summers of patient selection — nothing added, nothing altered.
          - generic [ref=e72]:
